navigation_cognition_master:
  ros__parameters:
    flows: [nav_goal_cognitive]
    nav_goal_cognitive: [nav_goal_cognitive_module]

nav_goal_cognitive_module:
  ros__parameters:
    core: nav_goal_cognitive_core
    afferent: nav_goal_cognitive_input
    efferent: nav_goal_cognitive_output
    meta: ""
    coupling: ""
    
    # Required cognitive processing parameters (for the core component)
    cognitive_processing_interval: 1.0
    goal_persistence_threshold: 3.0
    criticality_confidence_threshold: 0.8
    
    # Required inflation radius parameters (for the efferent component)
    normal_inflation_radius: 0.80 #0.55
    critical_inflation_radius: 0.01 #0.25
    recovery_inflation_radius: 0.10 #0.15
    
    nav_goal_cognitive_input:
      topics: ["/critical_goal"]
      types: ["std_msgs/msg/Bool"]
    
    nav_goal_cognitive_output:
      topics: ["/goal_criticality"]
      types: ["std_msgs/msg/Bool"]

# Behavior Trees
behavior_trees:
  ros__parameters:
    goal_cognition_bt:
      root: CriticalityPassThrough
      nodes:
        CriticalityPassThrough:
          type: SequenceNode
          children: [ReceiveCriticality, PublishCriticality]
        
        ReceiveCriticality:
          type: ConditionNode
          topic: "/critical_goal"
          
        PublishCriticality:
          type: ActionNode
          action: "/publish_goal_criticality"
    
    dynamic_reconfigure_bt:
      root: CostmapReconfigurer
      nodes:
        CostmapReconfigurer:
          type: SelectorNode
          children: [HandleCriticalGoal, HandleNormalGoal]
          
        HandleCriticalGoal:
          type: SequenceNode
          children: [IsCriticalGoal, ApplyCriticalCostmap]
          
        IsCriticalGoal:
          type: ConditionNode
          topic: "/goal_criticality"
          expected_value: true
          
        ApplyCriticalCostmap:
          type: ActionNode
          service: "/global_costmap/global_costmap/set_parameters"
          parameters:
            inflation_radius: 0.25  # Tight navigation
              
        HandleNormalGoal:
          type: ActionNode
          service: "/global_costmap/global_costmap/set_parameters"
          parameters:
            inflation_radius: 0.55  # Normal navigation