cs4mt_navigation_cognition_master:
  ros__parameters:
    flows: [nav_cognition_flow]
    nav_cognition_flow: [nav_goal_cognition, dynamic_reconfigure_nav]
## Trying and seeing if thus way works for MT  use-case in CS
nav_goal_cognition:
  ros__parameters:
    core: bt_navigator
    afferent: goal_input
    goal_input:
      topics: ["/critical_goal"] ### I am removing the absolute goal pose and trying simple version
      types: ["std_msgs/msg/Bool"]
    efferent: goal_output
    goal_output:
      topics: ["/goal_criticality"]
      types: [ "std_msgs/msg/Bool"] ## Extremely simple behaviour
    parameters:
      # Define critical zones or goal types - Fixed: ensure all numbers are same type
      critical_zones: [[10.0, 5.0, 2.0]]  # [x, y, radius] - areas where goals are critical
      emergency_keywords: ["emergency", "urgent", "critical"]
## Set params works, but need to see if hard values can be replaced with something more linearly scaling with respect to threshold to hoal,
## TODO: check if this is the right approach, come back to this
dynamic_reconfigure_nav:
  ros__parameters:
    core: dynamic_reconfigure_nav_bt
    afferent: nav2_input
    nav2_input:
      topics: ["/goal_criticality"]
      types: ["std_msgs/msg/Bool"]
    efferent: nav2_params
    nav2_params:
      topics: ["/global_costmap/set_parameters", "/local_costmap/set_parameters"]
      types: ["rcl_interfaces/srv/SetParameters", "rcl_interfaces/srv/SetParameters"]
    parameters:
      # Thresholds for triggering reconfiguration - Fixed: ensure consistent decimal notation
      distance_threshold: 2.0  # meters - if still this far from goal
      time_threshold: 30.0     # seconds - if taking too long
      stuck_threshold: 5.0     # seconds - if not making progress
      # Reconfigure parameters
      # normal_inflation_radius: 0.55
      # critical_inflation_radius: 0.35
      # recovery_inflation_radius: 0.25  # Even smaller when stuck

      # # Main feature: different inflation radii for critical vs normal goals
      # normal_inflation_radius: 0.55      # Normal obstacle avoidance
      # critical_inflation_radius: 0.25    # TIGHT navigation for critical goals
      # recovery_inflation_radius: 0.15    # Emergency recovery mode
      
      # # Optional: progression monitoring (for future enhancements)
      # distance_threshold: 2.0     # meters
      # time_threshold: 30.0        # seconds
      # stuck_threshold: 5.0        # seconds

# Behavior Trees
behavior_trees:
  ros__parameters:
    goal_cognition_bt:
      root: CriticalityPassThrough
      nodes:
        CriticalityPassThrough:
          type: SequenceNode
          children: [ReceiveCriticality, PublishCriticality]
        
        ReceiveCriticality:
          type: ConditionNode
          topic: "/critical_goal"
          
        PublishCriticality:
          type: ActionNode
          action: "/publish_goal_criticality"

    dynamic_reconfigure_bt:
      root: CostmapReconfigurer
      nodes:
        CostmapReconfigurer:
          type: SelectorNode
          children: [HandleCriticalGoal, HandleNormalGoal]
          
        HandleCriticalGoal:
          type: SequenceNode
          children: [IsCriticalGoal, ApplyCriticalCostmap]
          
        IsCriticalGoal:
          type: ConditionNode
          topic: "/goal_criticality"
          expected_value: true
          
        ApplyCriticalCostmap:
          type: ActionNode
          service: "/global_costmap/global_costmap/set_parameters"
          parameters:
            inflation_radius: 0.25  # Tight navigation
              
        HandleNormalGoal:
          type: ActionNode
          service: "/global_costmap/global_costmap/set_parameters"
          parameters:
            inflation_radius: 0.55  # Normal navigation
